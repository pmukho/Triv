services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=DEV
    depends_on:
      - game-factory

  db:
    build:
      context: ./db
      dockerfile: Dockerfile.db
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  db-seeder:
    build:
      context: .
      dockerfile: db/Dockerfile.seed
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db

  cache:
    build:
      context: ./cache
      dockerfile: Dockerfile
    container_name: cache
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db
      - redis

  game-factory:
    build:
      context: ./gamemaster
      dockerfile: Dockerfile
    container_name: game-factory
    ports:
      - "8003:8003"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db
      - cache

  question-gen:
    build:
      context: ./question_gen
      dockerfile: Dockerfile
    container_name: question-gen
    ports:
      - "8002:8002"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    

networks:
  project:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local